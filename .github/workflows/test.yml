name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  client:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os != 'Windows'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: runner.os != 'Windows'
        run: npm run build
      - if: runner.os != 'Windows'
        run: npm test
      - if: runner.os == 'Windows'
        shell: powershell
        run: '& ./scripts/install.ps1 -InstallPrerequisites:$false -LaunchPanel:$false'
      - if: runner.os == 'Windows'
        name: PATH refresh on Windows PowerShell 5.1
        shell: powershell
        run: '& ./tests/windows-install.test.ps1'
      - if: runner.os == 'Windows'
        name: PATH refresh on PowerShell 7
        shell: pwsh
        run: '& ./tests/windows-install.test.ps1'
      - if: runner.os == 'Windows'
        name: Uninstall ownership and retained state
        shell: powershell
        run: '& ./tests/windows-uninstall.test.ps1'
      - if: runner.os == 'Windows'
        shell: cmd
        run: starport-pi.cmd --version
      - run: npm run test:server
      - if: runner.os != 'Linux'
        name: Python discovery skips Linux-only worker tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/audit_source.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $ParseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$ParseErrors) | Out-Null
            if ($ParseErrors.Count) { throw ($ParseErrors | Out-String) }
          }
