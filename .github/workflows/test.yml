name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  client:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os != 'Windows'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: runner.os != 'Windows'
        run: npm test
      - if: runner.os == 'Windows'
        shell: pwsh
        run: '& ./scripts/install.ps1 -InstallPrerequisites:$false'
      - if: runner.os == 'Linux'
        run: npm run test:server
      - run: python scripts/audit_source.py
