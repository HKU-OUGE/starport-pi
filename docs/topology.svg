<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">Starport Pi: conversation and isolated projects</title><desc id="desc">The native workbench supports conversation-only sessions, remote gVisor projects, and optional dedicated Windows WSL2 plus gVisor projects. Task and model network traffic uses the selected Mihomo proxy. Phone access is protected by Cloudflare Access and Tunnel.</desc>
