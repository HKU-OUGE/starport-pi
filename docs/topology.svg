<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc">
<title id="title">Starport Pi topology</title><desc id="desc">Native Windows Pi workbench calls a remote gVisor worker over SSH. Model API and task egress use a selected proxy. Secrets stay in operator settings.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111b33"/><stop offset="1" stop-color="#15283e"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#67d9d0"/></marker></defs>
<rect width="1040" height="420" rx="20" fill="url(#bg)"/><g fill="#a7c3df" opacity=".5"><circle cx="29" cy="29" r="2"/><circle cx="1005" cy="75" r="2"/><circle cx="471" cy="37" r="1.5"/><circle cx="633" cy="384" r="1.5"/></g>
<g font-family="Segoe UI,Arial,sans-serif"><text x="34" y="48" font-size="23" fill="#eff9ff" font-weight="700">✦ STARPORT PI</text><text x="34" y="73" font-size="14" fill="#a7bfd7">Native workbench · Remote execution · Managed egress</text>
<rect x="34" y="104" width="292" height="174" rx="14" fill="#20354b" stroke="#4e7391"/><text x="54" y="135" fill="#f3fbff" font-size="20" font-weight="600">Windows / Linux / macOS</text><text x="54" y="166" fill="#9de9df" font-size="17">Pi + Starport console</text><text x="54" y="198" fill="#c0cfdf" font-size="14">Chat · files · jobs · model / effort</text><text x="54" y="225" fill="#c0cfdf" font-size="14">Operator-only server &amp; node settings</text><text x="54" y="253" fill="#f2d290" font-size="13">No model tools execute here</text>
<path d="M326 170 H465" stroke="#67d9d0" stroke-width="2" marker-end="url(#arrow)"/><text x="354" y="151" fill="#b9d4e5" font-size="13">SSH / RPC</text>
<rect x="472" y="104" width="532" height="174" rx="14" fill="#20354b" stroke="#4e7391"/><text x="492" y="136" fill="#f3fbff" font-size="20" font-weight="600">Existing Linux / Alibaba DSW server</text>
<rect x="492" y="156" width="286" height="100" rx="9" fill="#15283b" stroke="#67d9d0"/><text x="507" y="182" fill="#9de9df" font-size="16">gVisor task workspace</text><text x="507" y="207" fill="#c0cfdf" font-size="13">/workspace · /output · selected data</text><text x="507" y="234" fill="#c0cfdf" font-size="13">Taipei · zh_TW.UTF-8 · Noto CJK TC</text>
<text x="804" y="181" fill="#c0cfdf" font-size="14">CPU / memory / GPU</text><text x="804" y="211" fill="#c0cfdf" font-size="14">Read-only datasets</text><text x="804" y="241" fill="#c0cfdf" font-size="14">Logs &amp; artifacts</text>
<path d="M627 278 V309 H316" stroke="#67d9d0" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="393" y="301" fill="#b9d4e5" font-size="12">Task egress via SSH socket</text>
<rect x="34" y="298" width="276" height="83" rx="13" fill="#23394d" stroke="#67d9d0"/><text x="54" y="326" fill="#9de9df" font-size="16">Mihomo · selected exit</text><text x="54" y="352" fill="#c0cfdf" font-size="13">Failure → blocked, never direct</text>
<path d="M180 278 V295 M310 347 H777" stroke="#67d9d0" stroke-width="2" marker-end="url(#arrow)"/><text x="430" y="339" fill="#b9d4e5" font-size="13">Model API + task HTTPS</text>
<rect x="787" y="315" width="217" height="65" rx="12" fill="#23394d" stroke="#4e7391"/><text x="810" y="343" fill="#f3fbff" font-size="16">Internet services</text><text x="810" y="366" fill="#b9d4e5" font-size="13">Claude API · packages · data</text>
</g></svg>
