<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
<title id="title">Starport Pi deployment and execution</title><desc id="desc">A browser connects through per-user Cloudflare Access and Tunnel to the native Starport Pi workbench. The operator configures keys, subscriptions and servers. Model commands run only in a remote gVisor worker. Model and task traffic use the selected proxy.</desc>
