<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <cachedir>/tmp/font-cache</cachedir>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="strong"><family>sans</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Noto Serif CJK TC</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Noto Sans Mono CJK TC</family></prefer></alias>
  <match target="pattern"><test name="family" compare="eq"><string>sans-serif</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK TC</string></edit></match>
  <match target="pattern"><test name="family" compare="eq"><string>sans</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK TC</string></edit></match>
  <match target="pattern"><test name="family" compare="eq"><string>serif</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK TC</string></edit></match>
  <match target="pattern"><test name="family" compare="eq"><string>monospace</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Sans Mono CJK TC</string></edit></match>
  <match target="pattern"><test name="lang" compare="contains"><string>zh</string></test><edit name="lang" mode="assign"><string>zh-tw</string></edit></match>
  <selectfont><rejectfont>
    <pattern><patelt name="family"><string>Noto Sans CJK SC</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Serif CJK SC</string></patelt></pattern>
    <pattern><patelt name="family"><string>Noto Sans Mono CJK SC</string></patelt></pattern>
  </rejectfont></selectfont>
</fontconfig>
